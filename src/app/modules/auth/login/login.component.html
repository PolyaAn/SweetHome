<section class="login-page">
  <div class="login-card">
    <h1>Авторизация</h1>
    <p class="subtitle">Войдите, чтобы продолжить работу с приложением.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field-label" for="email">Почта</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="example@mail.com"/>
      <div class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Введите корректную почту
      </div>

      <label class="field-label" for="password">Пароль</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password"/>
      <div class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Введите пароль
      </div>

      <div class="actions">
        <button type="submit" [disabled]="form.invalid">Войти</button>
        <button type="button" class="register-button" (click)="goToRegister()">Регистрация</button>
      </div>
    </form>
  </div>
</section>
